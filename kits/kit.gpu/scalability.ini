# Scalability settings
# Each value in [0..1] unless noted otherwise.
# Effective value = node * all ancestors.
# Feature flags [0|1]: 0 disables the feature and its subtree.

# -- Global --------------------------------------------------
sc = 1.000

# -- Render --------------------------------------------------
sc_render = 1.000

# IBL – Image-Based Lighting
# sc_render_ibl [0|1]: 0 = hemisphere fallback, 1 = full IBL
sc_render_ibl = 1.000
# sc_render_ibl_samples [0..1]: 0=64 samples, 1=1024 samples
sc_render_ibl_samples = 1.000

# Textures
sc_render_texture = 1.000
sc_render_texture_mipmaps = 1.000
sc_render_texture_aniso = 1.000

# Shadows (not yet implemented)
sc_render_shadows = 0.000
sc_render_shadows_res = 1.000

# Post-processing (not yet implemented)
sc_render_post = 0.000
sc_render_post_bloom = 1.000
sc_render_post_ao = 1.000

# -- Audio ---------------------------------------------------
sc_audio = 1.000
# sc_audio_maxchannels [0..N]: maximum simultaneous channels
sc_audio_maxchannels = 32
