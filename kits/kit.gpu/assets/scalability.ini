# Scalability settings – Kit glTF Starter
# Each value in [0..1] unless noted otherwise.
# Effective value of any node = node * all ancestors.
# Feature flags [0|1]: setting to 0 disables the feature and its subtree.
#
# Presets (for reference):
#   LOW:    sc_render=0.5, sc_render_ibl=0 (hemisphere fallback), low aniso
#   MEDIUM: sc_render_ibl_samples=0.25 (~256 samples), 4× aniso
#   HIGH:   sc_render_ibl_samples=0.5  (~512 samples), 8× aniso
#   ULTRA:  all 1.0 (defaults below)

# -- Global ------------------------------------------------------------------
sc = 1.000

# -- Render ------------------------------------------------------------------
sc_render = 1.000

# IBL – Image-Based Lighting
# sc_render_ibl [0|1]: 0 = hemisphere fallback (cheap), 1 = full IBL
sc_render_ibl = 1.000
# sc_render_ibl_samples [0..1]: 0=64 samples, 1=1024 samples (prefilter quality)
sc_render_ibl_samples = 1.000

# Textures
sc_render_texture = 1.000
sc_render_texture_mipmaps = 1.000
sc_render_texture_aniso = 1.000

# Shadows (not yet implemented)
sc_render_shadows = 0.000
sc_render_shadows_res = 1.000

# Post-processing (not yet implemented)
sc_render_post = 0.000
sc_render_post_bloom = 1.000
sc_render_post_ao = 1.000

# -- Audio --------------------------------------------------------------------
sc_audio = 1.000
# sc_audio_maxchannels [0..N]: maximum simultaneous audio channels
sc_audio_maxchannels = 32
